<text x="835" y="321" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#EDEDE6">17+</text>
<text x="835" y="341" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="11" fill="#8A8F82">Events</text>
