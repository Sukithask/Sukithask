<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="410" viewBox="0 0 1000 410" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <radialGradient id="bgGlow" cx="0.8" cy="0.35" r="0.75">
    <stop offset="0" stop-color="#1f2d0a"/><stop offset="1" stop-color="#0B0D0A"/>
  </radialGradient>
  <radialGradient id="ringGlow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#C6F35B" stop-opacity="0.38"/><stop offset="1" stop-color="#C6F35B" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#C6F35B" stop-opacity="0"/><stop offset="0.5" stop-color="#C6F35B"/><stop offset="1" stop-color="#C6F35B" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#C6F35B" stroke-opacity="0.045"/>
  </pattern>
</defs>
<rect width="1000" height="410" rx="18" fill="#0B0D0A"/>
<rect width="1000" height="410" rx="18" fill="url(#bgGlow)"/>
<rect width="1000" height="410" rx="18" fill="url(#grid)"/>
<rect x="0.5" y="0.5" width="999" height="409" rx="18" fill="none" stroke="#262B1E"/>

<!-- left copy -->
<text x="48" y="62" font-family="'Courier New', Consolas, monospace" font-size="14" letter-spacing="2" fill="#8A8F82">[ MECHATRONICS · PORTFOLIO ]</text>
<text x="48" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="78" fill="#EDEDE6">Sukitha <tspan font-style="italic" fill="#C6F35B">SK</tspan></text>
<text x="48" y="215" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#EDEDE6">Where mechanics meets</text>
