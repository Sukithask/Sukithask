<text x="757" y="341" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="11" fill="#8C88A0">Wins</text>
<line x1="718" y1="304" x2="718" y2="346" stroke="#2A2540"/>
<text x="835" y="321" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#EEEBF5">17+</text>
<text x="835" y="341" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="11" fill="#8C88A0">Events</text>
