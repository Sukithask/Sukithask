<!-- right card -->
<rect x="640" y="30" width="312" height="335" rx="18" fill="#0F0D17" stroke="#2A2540"/>
<circle cx="796" cy="160" r="128" fill="url(#ringGlow)"><animate attributeName="opacity" values="0.55;1;0.55" dur="3s" repeatCount="indefinite"/></circle>
<g transform="translate(796 160)">
  <circle r="100" fill="none" stroke="#A78BFA" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.01 6.28">
