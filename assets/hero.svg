<text x="913" y="321" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#EEEBF5">4</text>
<text x="913" y="341" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="11" fill="#8C88A0">Projects</text>
<line x1="874" y1="304" x2="874" y2="346" stroke="#2A2540"/>

<!-- bottom line + pill -->
<line x1="48" y1="388" x2="952" y2="388" stroke="#2A1F4D" stroke-width="4" stroke-linecap="round"/>
<line x1="48" y1="388" x2="952" y2="388" stroke="#A78BFA" stroke-width="4" stroke-linecap="round" stroke-dasharray="140 764">
  <animate attributeName="stroke-dashoffset" from="904" to="0" dur="4s" repeatCount="indefinite"/></line>
<rect x="318" y="372" width="364" height="32" rx="16" fill="#171322" stroke="#2A2540"/>
<circle cx="342" cy="388" r="4" fill="#A78BFA"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
<text x="510" y="393" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="13" fill="#EEEBF5">sukitha · mechatronics · open to work</text>
