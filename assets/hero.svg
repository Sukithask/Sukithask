<text x="913" y="321" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#EDEDE6">4</text>
<text x="913" y="341" text-anchor="middle" font-family="'Courier New', Consolas, monospace" font-size="11" fill="#8A8F82">Projects</text>
<line x1="874" y1="304" x2="874" y2="346" stroke="#262B1E"/>

<!-- bottom line + pill -->
