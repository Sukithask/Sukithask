  <circle r="64" fill="none" stroke="#4B3A8F" stroke-width="2" stroke-dasharray="3 7">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/></circle>
  <!-- gear -->
