    <rect x="-6" y="-42" width="12" height="14" rx="2" fill="#C6F35B" transform="rotate(90)"/>
    <rect x="-6" y="-42" width="12" height="14" rx="2" fill="#C6F35B" transform="rotate(135)"/>
    <rect x="-6" y="-42" width="12" height="14" rx="2" fill="#C6F35B" transform="rotate(180)"/>
    <rect x="-6" y="-42" width="12" height="14" rx="2" fill="#C6F35B" transform="rotate(225)"/>
    <rect x="-6" y="-42" width="12" height="14" rx="2" fill="#C6F35B" transform="rotate(270)"/>
    <rect x="-6" y="-42" width="12" height="14" rx="2" fill="#C6F35B" transform="rotate(315)"/>
    <circle r="10" fill="#C6F35B"/><circle r="4" fill="#0B0D0A"/>
  </g>
</g>
