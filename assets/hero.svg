<text x="48" y="312" font-family="'Courier New', Consolas, monospace" font-size="15" fill="#8C88A0">Robotics · IoT · Embedded · Prosthetics</text>
<text x="48" y="338" font-family="'Courier New', Consolas, monospace" font-size="15" fill="#EEEBF5">&gt; open to robotics &amp; design roles</text>
