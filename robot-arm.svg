<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7048E8"/>
      <stop offset="1" stop-color="#5C4BD6"/>
    </linearGradient>
    <linearGradient id="link2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9F86F0"/>
      <stop offset="1" stop-color="#B4A0F5"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#2E1F6B" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="700" height="300" rx="22" fill="#F5EEDC"/>
  <rect width="700" height="300" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="698" height="298" rx="21" fill="none" stroke="#C5B3F7" stroke-width="2"/>

  <!-- title -->
  <text x="40" y="62" font-family="monospace" font-size="24" font-weight="bold" fill="#2E1F6B">BTC SPAR</text>
  <text x="40" y="88" font-family="monospace" font-size="14" fill="#5C4BD6">6-DOF Robotic Arm</text>
  <text x="40" y="250" font-family="monospace" font-size="12" fill="#7048E8">
    mechanics + electronics + code
    <animate attributeName="opacity" values="1;0.35;1" dur="2.5s" repeatCount="indefinite"/>
  </text>

  <!-- floor + base -->
  <rect x="380" y="255" width="260" height="10" rx="5" fill="#C5B3F7"/>
  <rect x="460" y="225" width="100" height="32" rx="8" fill="#2E1F6B"/>

  <!-- arm -->
  <g transform="translate(510 225)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-28;28;-28" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>
      <rect x="-12" y="-120" width="24" height="125" rx="12" fill="url(#link)"/>

      <g transform="translate(0 -110)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="45;-45;45" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>
          <rect x="-9" y="-95" width="18" height="100" rx="9" fill="url(#link2)"/>

          <g transform="translate(0 -92)">
            <!-- gripper -->
            <rect x="-16" y="-8" width="32" height="10" rx="4" fill="#2E1F6B"/>
            <rect x="-14" y="-30" width="6" height="26" rx="3" fill="#2E1F6B">
              <animateTransform attributeName="transform" type="translate" values="0 0;-8 0;0 0" dur="2s" repeatCount="indefinite"/>
            </rect>
            <rect x="8" y="-30" width="6" height="26" rx="3" fill="#2E1F6B">
              <animateTransform attributeName="transform" type="translate" values="0 0;8 0;0 0" dur="2s" repeatCount="indefinite"/>
            </rect>
          </g>
        </g>
        <!-- elbow joint -->
        <circle r="14" fill="#F5EEDC" stroke="#5C4BD6" stroke-width="3">
          <animate attributeName="r" values="14;17;14" dur="2s" repeatCount="indefinite"/>
        </circle>
      </g>
    </g>
    <!-- shoulder joint -->
    <circle r="17" fill="#F5EEDC" stroke="#7048E8" stroke-width="3">
      <animate attributeName="r" values="17;20;17" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- blinking status LEDs -->
  <circle cx="600" cy="50" r="5" fill="#7048E8"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
  <circle cx="620" cy="50" r="5" fill="#5C4BD6"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/></circle>
  <circle cx="640" cy="50" r="5" fill="#2E1F6B"><animate attributeName="opacity" values="1;0.2;1" dur="0.8s" repeatCount="indefinite"/></circle>
</svg>
